[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# The App Router needs this adapter. Without it Netlify publishes .next as
# static files and the home page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Forward all traffic from default Netlify subdomain to primary domain
[[redirects]]
  from = "https://mojakprimeai.netlify.app/*"
  to = "https://mojakprime.com/:splat"
  status = 301
  force = true

